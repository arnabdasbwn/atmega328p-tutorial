er Board.ATmega328P" id="ent0012" data-source-line="20"><path d="M41.5,400.609 L130.431,400.609 A3.75,3.75 0 0 1 132.931,403.109 L139.931,424.219 L450.5,424.219 A2.5,2.5 0 0 1 453,426.719 L453,725.109 A2.5,2.5 0 0 1 450.5,727.609 L41.5,727.609 A2.5,2.5 0 0 1 39,725.109 L39,403.109 A2.5,2.5 0 0 1 41.5,400.609" style="stroke:#000;stroke-width:1.5;" fill="none"/><line x1="39" y1="424.219" x2="139.931" y2="424.219" style="stroke:#000;stroke-width:1.5;"/><text x="43" y="417.143" fill="#000" font-size="14" textLength="87.931" font-weight="700">ATmega328P</text></g><!--entity MPU--><g class="entity" data-qualified-name="Typical Microprocessor-Based Board.MPU" id="ent0002" data-source-line="7"><rect x="22" y="144.109" width="115.689" height="55.219" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="32" y="168.643" fill="#000" font-size="14" textLength="95.689">Microprocessor</text><text x="32" y="186.252" fill="#000" font-size="14" textLength="29.559">CPU</text></g><!--entity RAM--><g class="entity" data-qualified-name="Typical Microprocessor-Based Board.RAM" id="ent0003" data-source-line="8"><rect x="306.5" y="226.609" width="106.345" height="37.609" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="316.5" y="251.143" fill="#000" font-size="14" textLength="86.345">Working RAM</text></g><!--entity STORAGE--><g class="entity" data-qualified-name="Typical Microprocessor-Based Board.STORAGE" id="ent0004" data-source-line="9"><rect x="296" y="153.609" width="126.606" height="37.609" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="306" y="178.143" fill="#000" font-size="14" textLength="106.606">Program Storage</text></g><!--entity IO--><g class="entity" data-qualified-name="Typical Microprocessor-Based Board.IO" id="ent0005" data-source-line="10"><rect x="304.5" y="80.609" width="110.248" height="37.609" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"