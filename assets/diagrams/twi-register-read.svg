<text x="21" y="513.245" fill="#000" font-size="13" textLength="465.366">The bus address is seven bits. The R/W bit is appended for each address phase.</text><text x="21" y="529.597" fill="#000" font-size="13" textLength="468.927">The MPU-6050 ACKs the transfer and returns its WHO_AM_I value; this does not</text><text x="21" y="545.948" fill="#000" font-size="13" textLength="290.469">verify sensor calibration or measured acceleration.</text></g></svg>